      <div><div class="muted">${T('l_def')}</div>${m.defs.map(i=>`<button class="opt" style="display:block;width:100%;margin:6px 0;${m.done[i]!==undefined?'opacity:.4':''}" data-d="${i}" ${m.done[i]!==undefined?'disabled':''}>${esc(t(LMATCH[i][1]))}</button>`).join('')}</div></div>
      ${all?`<div class="expl"><b>✔ ${T('l_done')}</b></div><div style="margin-top:12px"><button class="btn" id="mn">${T('next')} →</button></div>`:''}</div>`;
      $$('[data-t]',root).forEach(b=>b.onclick=()=>{m.sel=+b.dataset.t;render()});
      $$('[data-d]',root).forEach(b=>b.onclick=()=>{if(m.sel===null)return;const d=+b.dataset.d;S.tot++;if(d===m.sel){m.done[d]=1;m.done[m.sel]=1;S.pts++;S.corr++;sfx('ok')}else{m.wrong++;sfx('bad')}m.sel=null;render()});
      const mn=$('#mn',root);if(mn)mn.onclick=()=>{S.r=4;roundSetup();render()};
    }
    if(S.r===4){
      const q=LNEXT[S.nx],od=q.o;
      root.innerHTML=`${head()}<div class="panel"><h3 style="font-family:var(--body)">${T('l_next')}</h3><p style="font-size:1.25rem">“${esc(t(q.p))} <span style="color:var(--a1)">___</span>”</p>
      <div class="opts">${od.map((o,i)=>{const best=od.reduce((bi,x,j)=>x[1]>od[bi][1]?j:bi,0);let c='opt';if(S.na!==null){c+=i===best?' ok':i===S.na?' bad':' off'}return `<button class="${c}" data-n="${i}" ${S.na!==null?'disabled':''}>${esc(t(o[0]))}${S.na!==null?`<span style="float:right" class="num">${Math.round(o[1]*100)}%</span><span class="bar" style="display:block;height:5px;margin-top:6px"><i style="width:${o[1]*100}%"></i></span>`:''}</button>`}).join('')}</div>
      ${S.na!==null?`<div class="expl"><b>${T('l_prob')}</b><br>${esc(t(q.e))}</div><div style="margin-top:12px">${S.nx+1<LNEXT.length?`<button class="btn" id="nn">${T('next')} →</button>`:`<button class="btn" id="nf">${T('finish')}</button>`}</div>`:''}</div>`;
      $$('[data-n]',root).forEach(b=>b.onclick=()=>{const best=od.reduce((bi,x,j)=>x[1]>od[bi][1]?j:bi,0);S.na=+b.dataset.n;S.tot++;if(S.na===best){S.pts++;S.corr++;sfx('ok')}else sfx('bad');render()});
      const nn=$('#nn',root);if(nn)nn.onclick=()=>{S.nx++;S.na=null;render()};
      const nf=$('#nf',root);if(nf)nf.onclick=()=>{S.qstarted=false;showResult(9,{score:S.pts,max:S.tot,correct:S.pts,total:S.tot},()=>{S.started=false;render()})};
    }
  }
  return{render,destroy(){S.run&&S.run.destroy()}};
};

GAMES[9].mod=function(root,g){
  const TYPES=['text','image','audio','video','code'];
  let S={st:0,pts:0,tot:0,sel:null,done:{},wrong:null,ma:null,mi:0,mdone:{},si:0,sa:null,items:null,mm:null,started:false};
  function begin(){S={st:1,pts:0,tot:0,sel:null,done:{},wrong:null,mi:0,mdone:{},si:0,sa:null,started:true,items:shuffle(GITEMS.map((_,i)=>i)),mm:shuffle(GMATCH.map((_,i)=>i)),spots:shuffle(GSPOT.map((_,i)=>i)).slice(0,5),msel:null};render()}
  const head=()=>`<div class="hud"><span class="chip">${T('g_round')} ${S.st}/3</span><span class="chip">${T('score')}: <b>${S.pts}</b>/${S.tot}</span></div>`;
  function render(){
    if(!S.started){root.innerHTML=introHTML(g,`<div style="margin-top:16px"><button class="btn" id="gb">${T('begin')}</button></div>`);$('#gb',root).onclick=begin;return}
    if(S.st===1){
      const left=S.items.filter(i=>!S.done[i]);
      root.innerHTML=`${head()}<div class="panel"><h3 style="font-family:var(--body)">${T('g_sort')}</h3><div style="min-height:70px">${left.map(i=>`<button class="tag ${S.sel===i?'sel':''} ${S.wrong===i?'bad':''}" data-i="${i}">${esc(t(GITEMS[i][0]))}</button>`).join('')}</div>
      <div class="bins">${TYPES.map(k=>`<div class="bin" data-b="${k}" role="button" tabindex="0"><h4>${T('g_'+k)}</h4>${S.items.filter(i=>S.done[i]&&GITEMS[i][1]===k).map(i=>`<span class="tag ok">${esc(t(GITEMS[i][0]))}</span>`).join('')}</div>`).join('')}</div>
      ${!left.length?`<div style="margin-top:12px"><button class="btn" id="g1n">${T('next')} →</button></div>`:`<div style="margin-top:10px"><button class="btn sec sm" id="g1h">💡 ${T('hint')}</button></div>`}</div>`;
      $$('[data-i]',root).forEach(b=>b.onclick=()=>{S.sel=+b.dataset.i;S.wrong=null;render()});
      $$('[data-b]',root).forEach(b=>b.onclick=()=>{if(S.sel===null)return;S.tot++;if(GITEMS[S.sel][1]===b.dataset.b){S.done[S.sel]=1;S.pts++;sfx('ok');S.sel=null}else{S.wrong=S.sel;sfx('bad')}render()});
      const n=$('#g1n',root);if(n)n.onclick=()=>{S.st=2;render()};
      const h=$('#g1h',root);if(h)h.onclick=()=>{if(S.sel===null){toast(t(L('Select an item first.','Сначала выберите элемент.','Алдымен элемент таңдаңыз.')));return}if(!useHint())return;hintCount();toast('💡 '+T('g_'+GITEMS[S.sel][1]))};
    }
    if(S.st===2){
      const leftM=S.mm.filter(i=>!S.mdone[i]);
      root.innerHTML=`${head()}<div class="panel"><h3 style="font-family:var(--body)">${T('g_match')}</h3>
      ${leftM.length?`<div class="expl" style="border-color:var(--a2)"><b>${esc(t(GMATCH[leftM[0]][0]))}</b></div><div class="row" style="margin-top:12px">${TYPES.map(k=>`<button class="btn sec" data-m="${k}">${T('g_'+k)}</button>`).join('')}</div>${S.ma?`<div class="expl" style="border-color:var(--bad)">✖ ${T('wrong')}</div>`:''}`:`<div class="expl"><b>✔</b></div><div style="margin-top:12px"><button class="btn" id="g2n">${T('next')} →</button></div>`}
      <div style="margin-top:10px">${S.mm.filter(i=>S.mdone[i]).map(i=>`<span class="tag ok">${esc(t(GMATCH[i][0]))} → ${T('g_'+GMATCH[i][1])}</span>`).join('')}</div></div>`;
      $$('[data-m]',root).forEach(b=>b.onclick=()=>{const cur=leftM[0];S.tot++;if(GMATCH[cur][1]===b.dataset.m){S.mdone[cur]=1;S.pts++;S.ma=null;sfx('ok')}else{S.ma=1;sfx('bad')}render()});
      const n=$('#g2n',root);if(n)n.onclick=()=>{S.st=3;render()};
    }
    if(S.st===3){
      const q=GSPOT[S.spots[S.si]];
      root.innerHTML=`${head()}<div class="panel"><h3 style="font-family:var(--body)">${T('g_spot')} (${S.si+1}/${S.spots.length})</h3><div class="expl" style="border-color:var(--a2);font-size:1.05rem">${esc(t(q.c))}</div>
      <div class="opts">${[['g_hu',0],['g_ai',1]].map(([k,v])=>{let c='opt';if(S.sa!==null){c+=v===q.a?' ok':v===S.sa?' bad':' off'}return `<button class="${c}" data-s="${v}" ${S.sa!==null?'disabled':''}>${T(k)}</button>`}).join('')}</div>
      ${S.sa!==null?`<div class="expl"><b>${S.sa===q.a?'✔ '+T('correct'):'✖ '+T('wrong')}</b><br>${esc(t(q.e))}</div><div style="margin-top:12px">${S.si+1<S.spots.length?`<button class="btn" id="g3n">${T('next')} →</button>`:`<button class="btn" id="g3f">${T('finish')}</button>`}</div>`:''}</div>`;
      $$('[data-s]',root).forEach(b=>b.onclick=()=>{S.sa=+b.dataset.s;S.tot++;if(S.sa===q.a){S.pts++;sfx('ok')}else sfx('bad');render()});
      const n=$('#g3n',root);if(n)n.onclick=()=>{S.si++;S.sa=null;render()};
      const f=$('#g3f',root);if(f)f.onclick=()=>showResult(10,{score:S.pts,max:S.tot,correct:S.pts,total:S.tot},()=>{S.started=false;render()});
    }
  }
  return{render,destroy(){}};
};

GAMES[10].mod=function(root,g){
  const RISKS=['privacy','bias','deepfake','halluc','inject','cyber'];
  let S={i:0,step:0,pts:0,tot:0,ra:null,aa:null,cases:null,started:false,order:null};
  function begin(){S={i:0,step:0,pts:0,tot:0,ra:null,aa:null,cases:shuffle(CASES.map((_,i)=>i)),started:true};render()}
  function render(){
    if(!S.started){root.innerHTML=introHTML(g,`<div style="margin-top:16px"><button class="btn" id="db">${T('begin')}</button></div>`);$('#db',root).onclick=begin;return}
    const c=CASES[S.cases[S.i]],oo=S.order||(S.order=shuffle([0,1,2]));
    root.innerHTML=`<div class="hud"><span class="chip">${T('d_case')} #${String(S.i+1).padStart(2,'0')}/${CASES.length}</span><span class="chip">${T('score')}: <b>${S.pts}</b>/${S.tot}</span></div>
    <div class="panel case"><span class="stamp">${S.step===2?T('d_closed'):'CONFIDENTIAL'}</span><p style="font-size:1.1rem;margin-top:12px">${esc(t(c.s))}</p>
    <div class="row">${c.ev.map(e=>`<span class="chip warn">🔎 ${esc(t(e))}</span>`).join('')}</div>
    <h4 style="margin-top:14px">${S.step===0?'1. '+T('d_risk'):'1. '+T('d_risk')+': '+T('r_'+c.r)}</h4>
    ${S.step===0?`<div class="row">${RISKS.map(r=>`<button class="btn sec sm" data-r="${r}">${T('r_'+r)}</button>`).join('')}</div>`:`<div class="chip ${S.ra===c.r?'ok':'bad'}">${S.ra===c.r?'✔':'✖'} ${T('r_'+S.ra)}</div>`}
    ${S.step>=1?`<h4 style="margin-top:14px">2. ${T('d_act')}</h4><div class="opts" style="grid-template-columns:1fr">${oo.map(oi=>{let k='opt';if(S.step===2){k+=oi===c.a?' ok':oi===S.aa?' bad':' off'}return `<button class="${k}" data-o="${oi}" ${S.step===2?'disabled':''}>${esc(t(c.o[oi]))}</button>`}).join('')}</div>`:''}
    ${S.step===2?`<div class="expl">${esc(t(c.e))}</div><div style="margin-top:12px">${S.i+1<CASES.length?`<button class="btn" id="dn">${T('next')} →</button>`:`<button class="btn" id="df">${T('finish')}</button>`}</div>`:''}
    ${S.step===0?`<div style="margin-top:12px"><button class="btn sec sm" id="dh">💡 ${T('hint')}</button></div>`:''}</div>`;
    $$('[data-r]',root).forEach(b=>b.onclick=()=>{S.ra=b.dataset.r;S.tot++;if(S.ra===c.r){S.pts++;sfx('ok')}else sfx('bad');S.step=1;render()});
    $$('[data-o]',root).forEach(b=>b.onclick=()=>{S.aa=+b.dataset.o;S.tot++;if(S.aa===c.a){S.pts++;sfx('ok')}else sfx('bad');S.step=2;render()});
    const dh=$('#dh',root);if(dh)dh.onclick=()=>{if(!useHint())return;hintCount();toast('💡 '+esc(t(c.ev[0])))};
    const dn=$('#dn',root);if(dn)dn.onclick=()=>{S.i++;S.step=0;S.ra=null;S.aa=null;S.order=null;render()};
    const df=$('#df',root);if(df)df.onclick=()=>showResult(11,{score:S.pts,max:S.tot,correct:S.pts,total:S.tot},()=>{S.started=false;S.order=null;render()});
  }
  return{render,destroy(){}};
};

 b_stage:L('Stage','Этап','Кезең'),b_fight:L('Fight!','В бой!','Шайқас!'),b_boss:L('AI BOSS','AI BOSS','AI BOSS'),b_hp:L('Boss HP','HP босса','Бос HP'),

GAMES[11].mod=function(root,g){
  const STG=[{k:'b_s1',time:25},{k:'b_s2',time:22},{k:'b_s3',time:20},{k:'b_s4',time:18},{k:'b_s5',time:16},{k:'b_s6',time:14},{k:'b_boss',time:12}];
  let S={stage:0,hp:100,lives:5,correct:0,total:0,run:null,mode:'intro',hit:false,over:null};
  root.innerHTML='<div id="btop"></div><div id="bq"></div>';
  const top=$('#btop',root),bq=$('#bq',root);
  const FACES=['AI','?','Σ','λ','01','!'];
  function questions(i){
    if(i===0)return byTag('fund',3);
    if(i===1)return byTag('search',3);
    if(i===2)return[dynMinimaxQ(),...byTag('mm',2)];
    if(i===3)return[...byTag('llm',2),...byTag('gen',1)];
    if(i===4)return byTag('safe',3);
    if(i===5)return[dynMinimaxQ(),byTag('search',1)[0],byTag('llm',1)[0],byTag('safe',1)[0]];
    return[byTag('fund',1)[0],byTag('search',1)[0],dynMinimaxQ(),byTag('llm',1)[0],byTag('safe',1)[0]];
  }
  function topHTML(){
    const st=STG[Math.min(S.stage,6)];
    return `<div class="hud"><span class="chip">${T('b_stage')} ${S.stage+1}/7${S.stage===6?' · '+T('b_boss'):''}</span><span class="chip">${T(st.k)}</span><span class="chip hearts">${'♥'.repeat(S.lives)}<span style="opacity:.25">${'♥'.repeat(5-S.lives)}</span></span></div>
    <div class="stage-pips">${STG.map((_,i)=>`<i class="${i<S.stage?'on':i===S.stage?'cur':''}"></i>`).join('')}</div>
    <div class="boss-stage"><div class="boss-cube ${S.hit?'hit':''} ${S.over==='win'?'dead':''}">${FACES.map(f=>`<div>${f}</div>`).join('')}</div></div>
    <div class="row" style="justify-content:space-between"><b style="color:var(--a2)">${T('b_boss')}</b><span class="num">${T('b_hp')}: ${Math.max(0,S.hp)}</span></div><div class="hp"><i style="width:${Math.max(0,S.hp)}%"></i></div>`;
  }
  function paintTop(){top.innerHTML=topHTML()}
  function start(){S={stage:0,hp:100,lives:5,correct:0,total:0,run:null,mode:'intro',hit:false,over:null};render()}
  function interstitial(){
    const st=STG[S.stage];
    bq.innerHTML=`<div class="panel center"><div class="muted">${S.stage<6?T('b_stage')+' '+(S.stage+1)+'/7':'FINAL 7/7'}</div><h2>${T(st.k)}</h2><p>${S.stage===6?T('b_final'):S.stage===0?T('b_intro_hp'):''}</p><button class="btn pink" id="bgo">${T('b_fight')}</button></div>`;
    $('#bgo',bq).onclick=runStage;
  }
  function runStage(){
    const st=STG[S.stage],qs=questions(S.stage),dmg=S.stage<6?4:5;
    S.mode='fight';
    S.run=QuizRun(bq,{qs,time:st.time,stopWhen:()=>S.lives<=0,
      onAnswer:(ok)=>{S.total++;
        if(ok){S.correct++;S.hp-=dmg;S.hit=true;sfx('hit');setTimeout(()=>{S.hit=false;paintTop()},450)}else{S.lives--;}
        paintTop();
        if(S.lives<=0){S.run.stop();S.run=null;showLose(bq,start,'♥ 0')}
      },
      onEnd:()=>{
        S.run=null;
        if(S.lives<=0)return end('lose');
        S.stage++;
        if(S.stage>=7||S.hp<=0)return end('win');
        paintTop();S.mode='intro';interstitial();
      }});
    S.run.render();
  }
  function end(res){
    S.over=res;paintTop();
    if(res==='win'){S.hp=0;paintTop();confetti(220);setTimeout(()=>confetti(160),600);sfx('win')}
    bq.innerHTML=`<div class="panel center"><h2 style="color:${res==='win'?'var(--ok)':'var(--bad)'}">${res==='win'?T('b_victory'):T('b_defeat')}</h2><p>${S.correct} / ${S.total}</p><button class="btn" id="bfin">${T('finish')}</button></div>`;
    $('#bfin',bq).onclick=()=>showResult(12,{score:S.correct,max:24,correct:S.correct,total:24,flag:res==='win'?'boss':undefined,bonusXP:res==='win'?50:0},()=>{start()});
  }
  function render(){
    paintTop();
    if(S.over)return end(S.over);
    if(S.mode==='intro'){interstitial();return}
    if(S.run)S.run.render();
  }
  return{render,destroy(){S.run&&S.run.destroy()}};
};

(function boot(){
  document.documentElement.lang=LANGS[LANG];
  P();touchDay();startBg();drawTop();
  if(!location.hash)history.replaceState(null,'','#home');
  route();
})();
