<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI GAME WORLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: one dark neon "game universe" shell; each game screen re-skins itself through --a1/--a2/--gbg. */
:root{
  --bg:#060814; --bg2:#0b1030; --panel:rgba(16,21,50,.74); --panel2:rgba(26,32,72,.72);
  --line:rgba(130,150,255,.22); --txt:#e9edff; --mut:#9aa4d6;
  --a1:#19f0ff; --a2:#ff3df2; --ok:#35f08f; --bad:#ff4d6d; --warn:#ffc53d;
  --gbg:radial-gradient(circle at 20% 0%,#10224f 0,transparent 60%),radial-gradient(circle at 90% 100%,#2a0f4a 0,transparent 55%);
  --disp:'Orbitron','Exo 2',system-ui,sans-serif; --body:'Exo 2','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--disp);margin:0 0 .5em;line-height:1.15;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(2rem,6vw,4.2rem);font-weight:900}
h2{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--a1)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* top bar */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(6,8,20,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:900;font-size:1.05rem;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo b{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{width:30px;height:30px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.78rem;white-space:nowrap}
.nav button:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.nav button.on{color:#06101c;background:linear-gradient(90deg,var(--a1),#7aa2ff)}
.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lang button{background:none;border:0;padding:7px 10px;font-weight:800;font-size:.8rem;color:var(--mut)}
.lang button.on{background:var(--a2);color:#1b0620}
.me{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:5px 12px 5px 6px;border-radius:30px;cursor:pointer}
.me .av{width:32px;height:32px;font-size:1.1rem}
.me small{display:block;color:var(--mut);font-size:.68rem;line-height:1}
.me strong{font-family:var(--disp);font-size:.75rem}
.av{display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));font-size:1.6rem}
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.pg-in{animation:pgin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(8px);position:relative}
.card.glow{box-shadow:0 0 0 1px rgba(25,240,255,.12),0 10px 40px -12px rgba(25,240,255,.25)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.muted{color:var(--mut)}
.sec{margin-top:34px}
.sec>h2{display:flex;align-items:center;gap:12px}
.sec>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font-family:var(--disp);font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:#05101c;background:linear-gradient(90deg,var(--a1),#7aa2ff);box-shadow:0 0 22px -4px var(--a1);transition:transform .15s,box-shadow .15s,filter .15s;position:relative}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 34px -2px var(--a1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pink{background:linear-gradient(90deg,var(--a2),#ff8a5c);box-shadow:0 0 22px -4px var(--a2);color:#210620}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.sec:hover{border-color:var(--a1);box-shadow:0 0 18px -6px var(--a1)}
.btn.sm{padding:8px 14px;font-size:.72rem;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:.78rem;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:rgba(53,240,143,.4)}
.chip.bad{color:var(--bad);border-color:rgba(255,77,109,.4)}
.chip.warn{color:var(--warn);border-color:rgba(255,197,61,.4)}
.bar{height:10px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--a1)}
.num{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums}
.stat{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat .num{font-size:1.6rem;color:var(--a1)}
.stat small{color:var(--mut);display:block}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center;padding:20px 0 10px}
.hero h1 span{display:block;background:linear-gradient(90deg,var(--a1),var(--a2) 60%,#ffd34d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(25,240,255,.35))}
.hero .sub{font-size:1.15rem;color:var(--mut);max-width:34em;margin:14px 0 22px}
.robot-wrap{position:relative;display:grid;place-items:center;min-height:330px}
.robot{width:min(300px,80%);animation:float 4s ease-in-out infinite;filter:drop-shadow(0 20px 40px rgba(25,240,255,.35))}
@keyframes float{50%{transform:translateY(-14px) rotate(1.5deg)}}
.rb-eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{position:absolute;top:0;right:0;max-width:240px;background:#fff;color:#0a1030;padding:10px 14px;border-radius:16px 16px 4px 16px;font-weight:700;font-size:.9rem;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:pop .6s both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ring{position:absolute;width:340px;height:340px;border-radius:50%;border:1px dashed rgba(25,240,255,.35);animation:spin 24s linear infinite}
.ring.b{width:410px;height:410px;border-color:rgba(255,61,242,.3);animation-duration:36s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
/* game cards */
.gcard{cursor:pointer;padding:0;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;transform-style:preserve-3d;text-align:left;display:block;width:100%}
.gcard:hover{border-color:var(--a1);box-shadow:0 18px 50px -18px var(--a1)}
.gcard .art{height:118px;background:var(--gbg),var(--bg2);position:relative;display:block;border-bottom:1px solid var(--line)}
.gcard .art svg{position:absolute;inset:0;width:100%;height:100%}
.gcard .body{padding:14px 16px 16px;display:block}
.gcard h3{margin:0 0 4px;font-size:.98rem;color:var(--txt)}
.gcard p{margin:0 0 10px;color:var(--mut);font-size:.88rem;display:block}
.gnum{position:absolute;top:8px;left:10px;font-family:var(--disp);font-weight:900;font-size:.72rem;color:var(--a1);background:rgba(0,0,0,.45);padding:2px 8px;border-radius:8px;z-index:2}
.gcard[data-g="1"],.gs[data-g="1"]{--a1:#22e1ff;--a2:#ff3df2;--gbg:radial-gradient(circle at 50% 120%,#2b1070,transparent 60%),linear-gradient(160deg,#07142e,#150a38)}
.gcard[data-g="2"],.gs[data-g="2"]{--a1:#ffb347;--a2:#6ea8ff;--gbg:radial-gradient(circle at 50% 50%,#35210a,transparent 65%),linear-gradient(160deg,#0a1226,#1b1030)}
.gcard[data-g="3"],.gs[data-g="3"]{--a1:#b6ff5c;--a2:#ff6b9a;--gbg:conic-gradient(from 45deg at 50% 50%,#0b1a10,#101a24,#0b1a10,#101a24),linear-gradient(#0a140e,#0a140e)}
.gcard[data-g="4"],.gs[data-g="4"]{--a1:#4aa3ff;--a2:#ff4d5a;--gbg:linear-gradient(120deg,#07122c 0,#07122c 48%,#2a0a14 52%,#2a0a14 100%)}
.gcard[data-g="5"],.gs[data-g="5"]{--a1:#3dffb0;--a2:#a46bff;--gbg:linear-gradient(rgba(61,255,176,.06) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(61,255,176,.06) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(160deg,#04161a,#12072a)}
.gcard[data-g="6"],.gs[data-g="6"]{--a1:#ff7af0;--a2:#53f0ff;--gbg:radial-gradient(circle at 80% 20%,#3a0d46,transparent 55%),radial-gradient(circle at 10% 90%,#0b3a46,transparent 55%),#0b0a22}
.gcard[data-g="7"],.gs[data-g="7"]{--a1:#ffd23d;--a2:#37e6a0;--gbg:linear-gradient(160deg,#10150f,#171a07),repeating-linear-gradient(0deg,rgba(255,210,61,.05) 0 2px,transparent 2px 14px)}
.gcard[data-g="8"],.gs[data-g="8"]{--a1:#5df08a;--a2:#2fc7ff;--gbg:repeating-linear-gradient(0deg,rgba(93,240,138,.05) 0 1px,transparent 1px 4px),linear-gradient(160deg,#03120b,#04101d)}
.gcard[data-g="9"],.gs[data-g="9"]{--a1:#9a7bff;--a2:#ffd0f6;--gbg:radial-gradient(circle at 30% 30%,#2b1b6e,transparent 50%),radial-gradient(circle at 80% 70%,#4a1a63,transparent 50%),#070518}
.gcard[data-g="10"],.gs[data-g="10"]{--a1:#ff7a59;--a2:#ffd93d;--gbg:radial-gradient(circle at 10% 20%,#5a1a2e,transparent 45%),radial-gradient(circle at 90% 80%,#1e3a6a,transparent 50%),#14081a}
.gcard[data-g="11"],.gs[data-g="11"]{--a1:#e8f044;--a2:#ff3b66;--gbg:radial-gradient(circle at 50% 0%,rgba(232,240,68,.16),transparent 50%),linear-gradient(170deg,#0c0c14,#060610)}
.gcard[data-g="12"],.gs[data-g="12"]{--a1:#ff5d3d;--a2:#ffcf3d;--gbg:radial-gradient(circle at 50% 100%,#6a1408,transparent 60%),radial-gradient(circle at 50% 0%,#3a0a3a,transparent 60%),#0d0510}
/* game screen */
.gs{background:var(--gbg),var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px;min-height:560px;position:relative;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--a1) 18%,transparent),0 30px 80px -30px color-mix(in srgb,var(--a1) 40%,transparent)}
.gs-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gs-head h2{margin:0;flex:1;color:var(--a1);text-shadow:0 0 18px color-mix(in srgb,var(--a1) 55%,transparent)}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hud .chip b{font-family:var(--disp);color:var(--a1)}
.panel{background:rgba(0,0,0,.32);border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:16px;padding:16px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin:14px 0}
.opt{text-align:left;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--a1) 35%,transparent);border-radius:14px;padding:13px 16px;font-weight:600;transition:all .15s;position:relative;color:var(--txt)}
.opt:hover:not([disabled]){background:color-mix(in srgb,var(--a1) 16%,transparent);transform:translateX(4px);box-shadow:0 0 18px -6px var(--a1)}
.opt.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 22%,transparent)}
.opt.ok{background:rgba(53,240,143,.2);border-color:var(--ok);animation:okp .5s}
.opt.bad{background:rgba(255,77,109,.2);border-color:var(--bad);animation:shake .4s}
.opt.off{opacity:.3}
@keyframes okp{50%{transform:scale(1.03);box-shadow:0 0 30px var(--ok)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.expl{margin-top:12px;padding:12px 14px;border-left:3px solid var(--a1);background:rgba(255,255,255,.05);border-radius:0 12px 12px 0;animation:pgin .4s}
.timer{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));transform-origin:left;transition:transform .25s linear}
.combo{font-family:var(--disp);font-weight:900;color:var(--a2);animation:pop .4s}
.diff{display:flex;gap:8px;flex-wrap:wrap}
.diff button{padding:8px 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700}
.diff button.on{background:var(--a1);color:#06101c;border-color:var(--a1)}
.center{text-align:center}
.big{font-family:var(--disp);font-size:clamp(2rem,6vw,3.4rem);font-weight:900}
/* modal / toast */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(3,4,12,.78);backdrop-filter:blur(6px);padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal>.card{max-width:520px;width:100%;max-height:92vh;overflow:auto;background:#0d1230;animation:pgin .35s}
.toasts{position:fixed;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:#101638;border:1px solid var(--a1);padding:10px 14px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pgin .35s;font-weight:600}
.toast.ach{border-color:var(--warn)}
input[type=text],input[type=password],textarea,select{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 14px;font:inherit}
textarea{min-height:120px;resize:vertical}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:.85rem;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--a1)}
/* tables */
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.scroll-x{overflow-x:auto}
tr.me-row td{background:rgba(25,240,255,.1);font-weight:800}
.rank-n{font-family:var(--disp);font-weight:900;color:var(--warn)}
/* achievements */
.ach-i{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.ach-i.lock{opacity:.4;filter:grayscale(1)}
.ach-i .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf3d,#ff7a3d);font-size:1.3rem;flex:none}
/* weeks */
.week{display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%;transition:transform .2s,border-color .2s}
.week:hover{transform:translateX(5px);border-color:var(--a1)}
.week .wn{font-family:var(--disp);font-weight:900;font-size:1.5rem;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:#08101e;flex:none}
.week.done .wn{background:linear-gradient(135deg,var(--ok),#1db0ff)}
.theory h3{color:var(--a1);margin-top:1em}
.theory li{margin:.35em 0}
details.card summary{cursor:pointer;font-weight:800;font-family:var(--disp);font-size:.95rem}
/* trees (minimax / alpha-beta) */
.tree-svg{width:100%;height:auto;max-height:420px;display:block;touch-action:manipulation}
.tn{cursor:pointer;transition:all .2s}
.tn circle,.tn rect,.tn polygon{fill:#0b1530;stroke:var(--a1);stroke-width:2.5}
.tn.min circle,.tn.min polygon{stroke:var(--a2)}
.tn.leaf rect{stroke:#8aa0ff;fill:#101a3a}
.tn.cur circle,.tn.cur polygon,.tn.cur rect{stroke:#fff;filter:drop-shadow(0 0 8px #fff);animation:pulse 1s infinite}
.tn.done circle,.tn.done polygon{fill:color-mix(in srgb,var(--ok) 25%,#0b1530)}
.tn.mark rect,.tn.mark circle,.tn.mark polygon{stroke:var(--bad);fill:color-mix(in srgb,var(--bad) 28%,#0b1530)}
.tn.cut rect,.tn.cut circle,.tn.cut polygon{stroke:var(--bad);fill:color-mix(in srgb,var(--bad) 20%,#0b1530);opacity:.55}
.tn text{fill:#fff;font-family:var(--disp);font-weight:800;font-size:15px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tn .lab{font-size:10px;fill:var(--mut)}
@keyframes pulse{50%{stroke-width:5}}
.te{stroke:rgba(150,170,255,.45);stroke-width:2.5;fill:none;transition:all .3s}
.te.pick{stroke:var(--ok);stroke-width:4}
.te.cut{stroke:var(--bad);stroke-dasharray:6 5;opacity:.7}
.te.mark{stroke:var(--bad);stroke-width:4}
canvas.cv{width:100%;display:block;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);touch-action:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* history */
.tl{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.ev{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--a1) 35%,transparent);cursor:grab;user-select:none;transition:transform .15s,border-color .15s}
.ev.sel{border-color:#fff;box-shadow:0 0 0 2px var(--a1)}
.ev.drag{opacity:.4}
.ev.ok{background:rgba(53,240,143,.15);border-color:var(--ok)}
.ev.bad{background:rgba(255,77,109,.15);border-color:var(--bad)}
.ev .yr{font-family:var(--disp);font-weight:800;min-width:56px;color:var(--a1)}
.ev .grip{color:var(--mut);letter-spacing:-2px}
/* bins */
.bins{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bin{min-height:110px;border:2px dashed color-mix(in srgb,var(--a1) 45%,transparent);border-radius:16px;padding:10px;background:rgba(0,0,0,.25);cursor:pointer}
.bin h4{margin:0 0 6px;font-size:.78rem;color:var(--a1)}
.tag{display:inline-block;margin:3px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.1);font-size:.85rem;font-weight:600;border:1px solid transparent;cursor:pointer;color:var(--txt)}
.tag.sel{border-color:#fff;background:color-mix(in srgb,var(--a1) 30%,transparent)}
.tag.ok{background:rgba(53,240,143,.25)}
.tag.bad{background:rgba(255,77,109,.25)}
/* boss */
.stage-pips{display:flex;gap:6px}
.stage-pips i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.12)}
.stage-pips i.on{background:var(--a1);box-shadow:0 0 10px var(--a1)}
.stage-pips i.cur{background:var(--a2);animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.4}}
.boss-stage{perspective:700px;height:200px;display:grid;place-items:center}
.boss-cube{width:100px;height:100px;position:relative;transform-style:preserve-3d;animation:cube 9s linear infinite}
.boss-cube.hit{animation:cube 9s linear infinite,hitf .4s}
.boss-cube.dead{animation:dead 1.2s forwards}
.boss-cube div{position:absolute;inset:0;border:2px solid var(--a1);background:color-mix(in srgb,var(--a1) 14%,#100510);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:2.4rem;color:var(--a2);box-shadow:inset 0 0 30px color-mix(in srgb,var(--a1) 40%,transparent)}
.boss-cube div:nth-child(1){transform:translateZ(50px)}
.boss-cube div:nth-child(2){transform:rotateY(180deg) translateZ(50px)}
.boss-cube div:nth-child(3){transform:rotateY(90deg) translateZ(50px)}
.boss-cube div:nth-child(4){transform:rotateY(-90deg) translateZ(50px)}
.boss-cube div:nth-child(5){transform:rotateX(90deg) translateZ(50px)}
.boss-cube div:nth-child(6){transform:rotateX(-90deg) translateZ(50px)}
@keyframes cube{to{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes hitf{50%{filter:brightness(3) saturate(2)}}
@keyframes dead{to{transform:scale(0) rotate(720deg);opacity:0}}
.hp{height:16px;border-radius:10px;background:rgba(0,0,0,.5);border:1px solid var(--bad);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff2e4d,#ff9a3d);transition:width .6s}
.hearts{letter-spacing:3px;font-size:1.1rem;color:var(--bad)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
/* detective */
.case{border:1px solid color-mix(in srgb,var(--a1) 40%,transparent);background:repeating-linear-gradient(0deg,rgba(232,240,68,.03) 0 2px,transparent 2px 6px),rgba(0,0,0,.4);font-family:var(--body)}
.case .stamp{display:inline-block;border:2px solid var(--a2);color:var(--a2);padding:2px 10px;border-radius:6px;transform:rotate(-4deg);font-family:var(--disp);font-weight:900;font-size:.8rem}
/* prompt */
.term{font-family:ui-monospace,Menlo,Consolas,monospace}
.crit{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
@media(max-width:820px){
  .hero{grid-template-columns:1fr}
  .robot-wrap{min-height:260px;order:-1}
  .top{padding:8px 12px;gap:8px}
  .logo span{display:none}
  main{padding:14px 12px 50px}
  .crit{grid-template-columns:100px 1fr 34px}
  .me span.who{display:none}
  .gs{padding:12px;border-radius:16px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.gtype{position:absolute;top:8px;right:10px;z-index:2;display:flex;gap:5px;align-items:center;font-size:.68rem;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:8px;background:rgba(0,0,0,.55)}
.gtype.real{color:#ff6b7d;border:1px solid #ff6b7d}
.gtype.learn{color:#7dd3ff;border:1px solid #7dd3ff}
.lose{animation:shake .5s;border-color:var(--bad)}

.th-lead{padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(25,240,255,.14),rgba(255,61,242,.1));border:1px solid var(--line)}
.th-lead p{margin:6px 0 0;font-size:1.1rem;font-weight:600}
.th-tag{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--a1)}
.th-h{margin:18px 0 8px;font-family:var(--disp);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.th-steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:10px}

.th-steps li::before{content:counter(s);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:800;background:linear-gradient(135deg,var(--a1),var(--a2));color:#06101c}
.th-terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.th-term{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:flex;flex-direction:column;gap:4px}
.th-term b{color:var(--a1);font-family:var(--disp);font-size:.85rem}
.th-term span{color:var(--txt);font-size:.92rem}
.th-box{margin-top:14px;padding:12px 16px;border-radius:12px}
.th-box p{margin:6px 0 0}.th-box ul{margin:6px 0 0;padding-left:20px}
.th-box.ex{background:rgba(255,197,61,.1);border-left:4px solid var(--warn)}
.th-box.rem{background:rgba(53,240,143,.09);border-left:4px solid var(--ok)}

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app"><header class="top" id="top"></header><main id="view"></main></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
'use strict';
/* ===== helpers, i18n, storage, profile, XP, effects ===== */
const LANGS=['en','ru','kk'], LNAME=['EN','RU','ҚАЗ'];
let LANG=0;
const L=(en,ru,kk)=>[en,ru,kk];
const t=x=>Array.isArray(x)?(x[LANG]!==undefined?x[LANG]:x[0]):x;
const D={};
const T=k=>D[k]?t(D[k]):k;
const TF=(k,o)=>T(k).replace(/\{(\w+)\}/g,(m,a)=>o[a]!==undefined?o[a]:m);
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function shuffle(a,r){r=r||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=(a,r)=>a[Math.floor((r||Math.random)()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- storage (localStorage with in-memory fallback) ---- */
const mem={};
const ST={
  get(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return mem[k]!==undefined?mem[k]:null},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
};
const today=()=>new Date().toLocaleDateString('en-CA');
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toLocaleDateString('en-CA')};
const weekKey=()=>{const d=new Date(),y=d.getFullYear();return y+'-'+Math.floor((d-new Date(y,0,1))/604800000)};
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
let DB;
try{DB=JSON.parse(ST.get('agw3'))}catch(e){DB=null}
if(!DB||!DB.users)DB={users:{},cur:null,lang:0};
LANG=DB.lang||0;
const save=()=>ST.set('agw3',JSON.stringify(DB));
const AVATARS=['🤖','👾','🦊','🐉','🚀','🧠','🦄','🐺','⚡','🎮','🛰️','👽'];
function mkUser(name,pass,av){return{name,pass:pass?hash(pass):'',av:av||'🤖',xp:0,hints:5,streak:0,lastDay:'',created:Date.now(),
  stats:{played:0,correct:0,answered:0,time:0},best:{},done:{},weeks:{},ach:{},hist:[],
  daily:{day:'',played:0,correct:0,xp:0,claimed:{}},weekly:{wk:'',xp:0,claimed:false},last:null,flags:{},project:{title:'',text:''},xph:{},mute:false}}
function P(){if(!DB.cur||!DB.users[DB.cur]){DB.users.Player=DB.users.Player||mkUser('Player','', '🤖');DB.cur='Player'}return DB.users[DB.cur]}
function touchDay(){
  const p=P(),d=today();
  if(p.daily.day!==d){p.daily={day:d,played:0,correct:0,xp:0,claimed:{}}}
  if(p.weekly.wk!==weekKey()){p.weekly={wk:weekKey(),xp:0,claimed:false}}
  if(p.lastDay!==d){p.streak=(p.lastDay===yesterday())?p.streak+1:1;p.lastDay=d}
  save();
}

/* ---- levels ---- */
const LV=[0,150,400,800,1400,2200,3200];
const LVN=[L('AI Beginner','AI-новичок','AI-бастаушы'),L('Code Explorer','Исследователь кода','Код зерттеушісі'),L('Search Master','Мастер поиска','Іздеу шебері'),
  L('Neural Architect','Нейро-архитектор','Нейро-сәулетші'),L('Prompt Engineer','Промпт-инженер','Промпт-инженер'),L('AI Expert','AI-эксперт','AI-сарапшы'),L('AI Legend','AI-легенда','AI-аңыз')];
function lvOf(xp){let l=0;for(let i=0;i<LV.length;i++)if(xp>=LV[i])l=i;return l}
function lvInfo(xp){const l=lvOf(xp),lo=LV[l],hi=LV[l+1];return{l,name:t(LVN[l]),lo,hi,pct:hi?Math.round((xp-lo)/(hi-lo)*100):100,left:hi?hi-xp:0}}

/* ---- achievements ---- */
const ACH=[
 {id:'first',ic:'🏆',n:L('First Victory','Первая победа','Алғашқы жеңіс'),d:L('Finish any game with 50%+','Заверши любую игру на 50%+','Кез келген ойынды 50%+ аяқта'),f:p=>Object.values(p.best).some(v=>v>=50)},
 {id:'quiz',ic:'🧠',n:L('Quiz Master','Мастер викторин','Викторина шебері'),d:L('Score 80%+ in AI Quiz Battle','80%+ в AI Quiz Battle','AI Quiz Battle-де 80%+'),f:p=>(p.best[1]||0)>=80},
 {id:'algo',ic:'⚙️',n:L('Algorithm Genius','Гений алгоритмов','Алгоритм данышпаны'),d:L('60%+ in Minimax, Alpha-Beta and Search Race','60%+ в Minimax, Alpha-Beta и Search Race','Minimax, Alpha-Beta, Search Race-те 60%+'),f:p=>[3,4,5].every(g=>(p.best[g]||0)>=60)},
 {id:'neural',ic:'🕸️',n:L('Neural Network Creator','Создатель нейросети','Нейрожелі жасаушы'),d:L('Train a network that solves XOR','Обучи сеть, решающую XOR','XOR шешетін желіні үйрет'),f:p=>!!p.flags.xor},
 {id:'prompt',ic:'⌨️',n:L('Prompt Pro','Про промптов','Промпт шебері'),d:L('80%+ in Prompt Engineer','80%+ в Prompt Engineer','Prompt Engineer-де 80%+'),f:p=>(p.best[8]||0)>=80},
 {id:'det',ic:'🕵️',n:L('Security Detective','Детектив безопасности','Қауіпсіздік детективі'),d:L('70%+ in AI Security Detective','70%+ в AI Security Detective','AI Security Detective-те 70%+'),f:p=>(p.best[11]||0)>=70},
 {id:'streak',ic:'🔥',n:L('3-Day Streak','Серия 3 дня','3 күн қатарынан'),d:L('Play 3 days in a row','Играй 3 дня подряд','3 күн қатарынан ойна'),f:p=>p.streak>=3},
 {id:'explorer',ic:'🧭',n:L('Explorer','Исследователь','Зерттеуші'),d:L('Try all 12 games','Попробуй все 12 игр','12 ойынның бәрін көр'),f:p=>Object.keys(p.done).length>=12},
 {id:'legend',ic:'👑',n:L('AI Legend','AI-легенда','AI-аңыз'),d:L('Defeat the Final AI Boss','Победи финального AI-босса','Финалдық AI-босты жең'),f:p=>!!p.flags.boss}
];
function checkAch(){
  const p=P(),got=[];
  ACH.forEach(a=>{if(!p.ach[a.id]&&a.f(p)){p.ach[a.id]=Date.now();got.push(a);toast('<b>'+a.ic+' '+esc(t(a.n))+'</b><br><small>'+esc(t(a.d))+'</small>','ach')}});
  if(got.length)save();
  return got;
}

/* ---- XP / missions ---- */
function missions(){
  const r=rng(+today().replace(/-/g,''));
  return[
   {id:'m1',k:'played',target:2+Math.floor(r()*2),xp:25,n:L('Play games: {n}','Сыграй игр: {n}','Ойын ойна: {n}')},
   {id:'m2',k:'correct',target:8+Math.floor(r()*5),xp:30,n:L('Correct answers: {n}','Правильных ответов: {n}','Дұрыс жауап: {n}')},
   {id:'m3',k:'xp',target:60+Math.floor(r()*4)*20,xp:40,n:L('Earn XP: {n}','Заработай XP: {n}','XP жина: {n}')}];
}
const WEEKLY_TARGET=400;
function addXP(n,silent){
  const p=P();n=Math.round(n);if(n<=0)return{lvUp:false};
  const before=lvOf(p.xp);
  p.xp+=n;p.daily.xp+=n;p.weekly.xp+=n;p.xph[today()]=(p.xph[today()]||0)+n;
  const after=lvOf(p.xp),up=after>before;
  if(up){p.hints+=1;}
  save();
  if(!silent)toast('+'+n+' XP');
  if(up&&!silent){toast('⬆ '+T('levelup')+': '+t(LVN[after]),'ach');confetti()}
  checkMissions();updateTop();
  return{lvUp:up,level:after};
}
function checkMissions(){
  const p=P();
  missions().forEach(m=>{
    if(!p.daily.claimed[m.id]&&p.daily[m.k]>=m.target){p.daily.claimed[m.id]=1;p.hints+=1;toast('✔ '+TF('mission_done',{n:m.xp}),'ach');p.xp+=m.xp;p.xph[today()]=(p.xph[today()]||0)+m.xp}
  });
  if(!p.weekly.claimed&&p.weekly.xp>=WEEKLY_TARGET){p.weekly.claimed=true;p.xp+=100;toast('★ '+T('weekly_done'),'ach');confetti()}
  save();
}
/* record a finished game; returns summary for the result window */
function record(g,res){
  const p=P();
  const pct=res.max?Math.round(res.score/res.max*100):0;
  let xp=Math.round(10+pct*1.1)+(pct>=100?20:0)+(res.bonusXP||0);
  p.stats.played++;p.daily.played++;
  p.stats.correct+=res.correct||0;p.stats.answered+=res.total||0;p.daily.correct+=res.correct||0;
  p.stats.time+=res.time||0;
  p.best[g]=Math.max(p.best[g]||0,pct);p.done[g]=(p.done[g]||0)+1;
  p.hist.unshift({g,pct,xp,ts:Date.now()});p.hist=p.hist.slice(0,40);
  if(res.flag)p.flags[res.flag]=1;
  p.last={type:'game',id:g};
  save();
  const lvBefore=lvOf(p.xp);
  const r=addXP(xp,true);
  const ach=checkAch();
  updateTop();
  return{pct,xp,lvUp:r.lvUp,level:lvOf(p.xp),ach,stars:pct>=90?3:pct>=65?2:pct>=35?1:0};
}
function useHint(){
  const p=P();
  if(p.hints<=0){toast(T('no_hints'));return false}
  p.hints--;save();updateTop();return true;
}

/* ---- toast / modal ---- */
function toast(html,cls){
  let box=$('#toasts');if(!box)return;
  const d=document.createElement('div');d.className='toast '+(cls||'');d.innerHTML=html;box.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';setTimeout(()=>d.remove(),450)},3200);
  while(box.children.length>4)box.firstChild.remove();
}
function modal(html,opt){
  closeModal();
  const m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML='<div class="card" role="dialog" aria-modal="true">'+html+'</div>';
  m.addEventListener('click',e=>{if(e.target===m&&!(opt&&opt.sticky))closeModal()});
  document.body.appendChild(m);return m;
}
function closeModal(){const m=$('#modal');if(m)m.remove()}

/* ---- sound ---- */
let AC=null;
function sfx(kind){
  try{
    if(P().mute)return;
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.08],[880,.12]],bad:[[220,.14],[160,.18]],win:[[523,.1],[659,.1],[784,.1],[1047,.25]],tick:[[500,.03]],hit:[[300,.05],[120,.12]]}[kind]||[];
    let at=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'||kind==='hit'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.06,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d);at+=d});
  }catch(e){}
}

/* ---- confetti ---- */
function confetti(n){
  const c=$('#fx');if(!c)return;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#19f0ff','#ff3df2','#ffd23d','#35f08f','#ff5d3d','#9a7bff'];
  const ps=Array.from({length:n||140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,s:4+Math.random()*6,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,l:90+Math.random()*40}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-f/p.l);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<140)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---- animated background ---- */
function startBg(){
  const c=$('#bg');if(!c)return;const x=c.getContext('2d');let w,h,pts=[];
  const fit=()=>{w=c.width=innerWidth;h=c.height=innerHeight;pts=Array.from({length:Math.min(70,Math.floor(w*h/22000))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}))};
  fit();addEventListener('resize',fit);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){return}
  (function loop(){
    x.clearRect(0,0,w,h);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1});
    for(let i=0;i<pts.length;i++){const a=pts[i];x.fillStyle='rgba(120,200,255,.7)';x.fillRect(a.x,a.y,2,2);
      for(let j=i+1;j<pts.length;j++){const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.strokeStyle='rgba(110,140,255,'+(0.16*(1-d/130))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
    requestAnimationFrame(loop);
  })();
}
/* ===== content: question bank, weeks, game meta ===== */
const BANK=[];
const Q=(tag,q,o,a,e)=>BANK.push({tag,q,o,a,e});
const O=(...a)=>a; // options helper

/* --- fundamentals --- */
Q('fund',L('What is Artificial Intelligence?','Что такое искусственный интеллект?','Жасанды интеллект дегеніміз не?'),
 [L('Machines that perform tasks that normally need human intelligence','Машины, выполняющие задачи, обычно требующие человеческого интеллекта','Әдетте адам интеллектін қажет ететін міндеттерді орындайтын машиналар'),L('Any machine with a screen','Любая машина с экраном','Экраны бар кез келген машина'),L('A very fast calculator','Очень быстрый калькулятор','Өте жылдам калькулятор'),L('A type of internet cable','Вид интернет-кабеля','Интернет кабелінің түрі')],0,
 L('AI is the field of building systems that perceive, reason, learn and act in ways we associate with human intelligence.','ИИ — область создания систем, которые воспринимают, рассуждают, обучаются и действуют так, как мы связываем с человеческим интеллектом.','ЖИ — қабылдайтын, пайымдайтын, үйренетін және адам интеллектіне тән әрекет ететін жүйелерді жасау саласы.'));
Q('fund',L('Which type of AI exists today?','Какой тип ИИ существует сегодня?','Бүгін қандай ЖИ түрі бар?'),
 [L('Narrow AI (ANI)','Узкий ИИ (ANI)','Тар ЖИ (ANI)'),L('Artificial General Intelligence (AGI)','Общий ИИ (AGI)','Жалпы ЖИ (AGI)'),L('Superintelligence (ASI)','Сверхинтеллект (ASI)','Суперинтеллект (ASI)'),L('Conscious AI','Сознательный ИИ','Саналы ЖИ')],0,

/* dynamic minimax question for Final Boss / tests */
function dynMinimaxQ(){
  const a=[rint(1,9),rint(1,9),rint(1,9),rint(1,9)];
  const l=Math.min(a[0],a[1]),r=Math.min(a[2],a[3]),v=Math.max(l,r);
  const set=new Set([v]);while(set.size<4)set.add(rint(1,9));
  const opts=shuffle([...set].map(String));
  return{tag:'mm',dyn:true,q:L('Root is MAX, its two children are MIN. Leaves left→right: '+a.join(', ')+'. What is the root value?','Корень — MAX, два его потомка — MIN. Листья слева направо: '+a.join(', ')+'. Чему равно значение корня?','Түбір — MAX, оның екі баласы — MIN. Жапырақтар солдан оңға: '+a.join(', ')+'. Түбір мәні неге тең?'),
   o:opts,a:opts.indexOf(String(v)),e:L('MIN nodes: min('+a[0]+','+a[1]+')='+l+' and min('+a[2]+','+a[3]+')='+r+'. MAX takes max('+l+','+r+')='+v+'.','Узлы MIN: min('+a[0]+','+a[1]+')='+l+' и min('+a[2]+','+a[3]+')='+r+'. MAX берёт max('+l+','+r+')='+v+'.','MIN түйіндері: min('+a[0]+','+a[1]+')='+l+' және min('+a[2]+','+a[3]+')='+r+'. MAX max('+l+','+r+')='+v+' алады.')};
}

  th:[L('A search problem has states, actions, a goal test and path costs. We explore a graph from the start state until we reach a goal.','Задача поиска: состояния, действия, проверка цели и стоимости пути. Мы обходим граф от начального состояния до цели.','Іздеу есебі: күйлер, әрекеттер, мақсат тексеру және жол құны. Біз графты бастапқы күйден мақсатқа дейін аралаймыз.'),

  th:[L('In a two-player zero-sum game, MAX picks the child with the largest value and MIN picks the smallest. Leaf values come from an evaluation function.','В антагонистической игре двух игроков MAX выбирает потомка с наибольшим значением, MIN — с наименьшим. Значения листьев даёт оценочная функция.','Екі ойыншылы нөлдік қосындылы ойында MAX ең үлкен, MIN ең кіші мәнді баланы таңдайды. Жапырақ мәндерін бағалау функциясы береді.'),
      L('Alpha = best value MAX can guarantee so far; Beta = best value MIN can guarantee so far.','Альфа — лучшее значение, которое MAX уже гарантирует; бета — лучшее значение, которое гарантирует MIN.','Альфа — MAX қазірше кепілдей алатын ең жақсы мән; бета — MIN кепілдей алатын ең жақсы мән.'),
      L('Prune when α ≥ β. Good move ordering can cut the work from O(b^d) to about O(b^(d/2)).','Отсекайте при α ≥ β. Хорошее упорядочение ходов сокращает работу с O(b^d) до примерно O(b^(d/2)).','α ≥ β болғанда кесіңіз. Жүрістерді жақсы реттеу жұмысты O(b^d)-ден шамамен O(b^(d/2))-ге дейін азайтады.')]},

  th:[L('An LLM is a huge neural network trained to predict the next token. Text is split into tokens, mapped to vectors and processed by Transformer layers.','LLM — огромная нейросеть, обученная предсказывать следующий токен. Текст делится на токены, превращается в векторы и обрабатывается слоями трансформера.','LLM — келесі токенді болжауға үйретілген алып нейрожелі. Мәтін токендерге бөлінеді, векторларға айналады және трансформер қабаттарында өңделеді.'),

const TH2={
1:{lead:L('AI is a program that learns from examples instead of following only fixed rules.','ИИ — это программа, которая учится на примерах, а не только следует жёстким правилам.','ЖИ — қатаң ережелерді ғана емес, үлгілерден үйренетін бағдарлама.'),
 terms:[[L('Artificial Intelligence','Искусственный интеллект','Жасанды интеллект'),L('Machines doing tasks that need human-like thinking.','Машины, решающие задачи, требующие «человеческого» мышления.','Адамша ойлауды қажет ететін міндеттерді орындайтын машиналар.')],
  [L('Machine Learning','Машинное обучение','Машиналық оқыту'),L('The computer finds patterns in data by itself.','Компьютер сам находит закономерности в данных.','Компьютер деректердегі заңдылықты өзі табады.')],
  [L('Neural network','Нейросеть','Нейрожелі'),L('Many simple "neurons" connected in layers.','Много простых «нейронов», соединённых слоями.','Қабат-қабат жалғасқан көптеген қарапайым «нейрондар».')]],
 ex:L('Example: to teach a child what a cat is, you show many cat photos. An ML model does the same: it sees thousands of labelled photos and learns what "cat" looks like.','Пример: чтобы научить ребёнка узнавать кошку, вы показываете много фото. Модель ML делает то же: смотрит тысячи размеченных фото и учится понимать, как выглядит «кошка».','Мысал: баланы мысықты танытуға көп сурет көрсетесіз. ML моделі де сондай: мыңдаған таңбаланған суретті көріп, «мысық» қалай көрінетінін үйренеді.'),
 rem:[L('Today\'s AI is narrow: very good at one task.','Современный ИИ узкий: очень силён в одной задаче.','Қазіргі ЖИ тар: бір міндетте өте күшті.'),L('ML ⊃ Deep Learning ⊃ Neural networks.','ML ⊃ глубокое обучение ⊃ нейросети.','ML ⊃ терең оқыту ⊃ нейрожелілер.')]},
2:{lead:L('AI grew in waves: big hopes, disappointment ("winters"), then new breakthroughs.','ИИ развивался волнами: большие надежды, разочарование («зимы»), затем новые прорывы.','ЖИ толқынмен дамыды: үлкен үміт, көңіл қалу («қыстар»), сосын жаңа жетістіктер.'),
 terms:[[L('Turing Test','Тест Тьюринга','Тьюринг тесті'),L('If you cannot tell a machine from a human in conversation, it passes.','Если в разговоре нельзя отличить машину от человека, она проходит тест.','Сөйлесуде машинаны адамнан ажырата алмасаңыз, ол тесттен өтеді.')],
  [L('AI winter','Зима ИИ','ЖИ қысы'),L('A period when funding and interest fell because results disappointed.','Период спада финансирования и интереса из-за разочарования в результатах.','Нәтиже көңіл қалдырғандықтан қаржы мен қызығушылық азайған кезең.')],
  [L('Deep learning boom','Бум глубокого обучения','Терең оқыту буымы'),L('Since 2012: big data + GPUs + deep networks.','С 2012 года: большие данные + GPU + глубокие сети.','2012 жылдан: үлкен деректер + GPU + терең желілер.')]],
 ex:L('Example timeline: 1950 idea → 1956 name "AI" → 1997 chess champion beaten → 2016 Go champion beaten → 2022 chatbots for everyone.','Пример хронологии: 1950 идея → 1956 название «ИИ» → 1997 побеждён шахматный чемпион → 2016 побеждён чемпион по го → 2022 чат-боты для всех.','Хронология: 1950 идея → 1956 «ЖИ» атауы → 1997 шахмат чемпионы жеңілді → 2016 го чемпионы жеңілді → 2022 бәріне арналған чат-боттар.'),
 rem:[L('Dates are easier to remember as stories: idea → name → chess → Go → chatbots.','Даты проще помнить как историю: идея → название → шахматы → го → чат-боты.','Күндерді оқиға ретінде есте сақтау оңай: идея → атау → шахмат → го → чат-боттар.')]},
3:{lead:L('This week you check what you know. Use the games, then the test.','На этой неделе вы проверяете знания. Пройдите игры, затем тест.','Бұл аптада білімді тексересіз. Алдымен ойындар, сосын тест.'),
 terms:[[L('Training set','Обучающая выборка','Оқыту жиыны'),L('Data the model learns from.','Данные, на которых модель учится.','Модель үйренетін деректер.')],
  [L('Test set','Тестовая выборка','Тест жиыны'),L('New data used to check the model honestly.','Новые данные для честной проверки модели.','Модельді адал тексеруге арналған жаңа деректер.')],
  [L('Overfitting','Переобучение','Шамадан тыс үйрену'),L('Memorising examples instead of learning the rule.','Заучивание примеров вместо понимания правила.','Ережені түсінбей, үлгілерді жаттап алу.')]],
 ex:L('Example: a student who memorises last year\'s answers gets 100% on practice but fails the new exam. That is overfitting.','Пример: студент, заучивший ответы прошлого года, на тренировке получает 100%, но проваливает новый экзамен. Это переобучение.','Мысал: былтырғы жауаптарды жаттаған студент жаттығуда 100% алады, жаңа емтиханнан құлайды. Бұл — шамадан тыс үйрену.'),
 rem:[L('Defence tip: for each concept give one example and one limitation.','Совет к защите: к каждому понятию — один пример и одно ограничение.','Қорғау кеңесі: әр ұғымға бір мысал және бір шектеу келтіріңіз.')]},
4:{lead:L('A search algorithm is a plan for exploring options until you reach the goal.','Алгоритм поиска — это план перебора вариантов, пока не дойдёте до цели.','Іздеу алгоритмі — мақсатқа жеткенше нұсқаларды қарап шығу жоспары.'),
 terms:[[L('BFS','BFS','BFS'),L('Ripples in water: explore all nearest cells first. Fewest steps.','Круги по воде: сначала все ближайшие клетки. Минимум шагов.','Судағы толқын: алдымен ең жақын ұяшықтар. Қадам ең аз.')],
  [L('DFS','DFS','DFS'),L('Walk down one corridor to the end, then back up. Low memory, not shortest.','Идти по одному коридору до конца, потом назад. Мало памяти, путь не кратчайший.','Бір дәліздің соңына дейін барып, кері қайту. Жад аз, жол ең қысқа емес.')],
  [L('UCS','UCS','UCS'),L('Always extend the cheapest route so far, like the cheapest taxi fare.','Всегда продолжать самый дешёвый маршрут, как самый дешёвый тариф такси.','Әрдайым ең арзан маршрутты жалғастыру, ең арзан такси тарифі сияқты.')],
  [L('A*','A*','A*'),L('Like a navigation app: cost so far + estimate to the goal.','Как навигатор: пройденная цена + оценка до цели.','Навигатор сияқты: өткен құн + мақсатқа дейінгі баға.')]],
 ex:L('Example: in a maze with mud (cost 5) and floor (cost 1), BFS finds the fewest steps but may walk through mud. UCS and A* find the cheapest path, and A* looks at fewer cells.','Пример: в лабиринте с грязью (цена 5) и полом (цена 1) BFS найдёт наименьшее число шагов, но может пройти по грязи. UCS и A* найдут самый дешёвый путь, а A* просмотрит меньше клеток.','Мысал: балшығы (құны 5) және едені (құны 1) бар лабиринтте BFS қадамы ең аз жолды табады, бірақ балшықтан өтуі мүмкін. UCS пен A* ең арзан жолды табады, A* аз ұяшық қарайды.'),
 rem:[L('Fewest steps → BFS. Cheapest → UCS or A*. Tiny memory → DFS.','Меньше шагов → BFS. Дешевле всего → UCS или A*. Мало памяти → DFS.','Қадам аз → BFS. Ең арзан → UCS не A*. Жад аз → DFS.'),L('A good heuristic never overestimates the real remaining cost.','Хорошая эвристика никогда не завышает реальную оставшуюся цену.','Жақсы эвристика қалған нақты құнды ешқашан асыра бағаламайды.')]},
5:{lead:L('In a two-player game you pick your best move, and your opponent picks the move that is worst for you.','В игре двух игроков вы выбираете лучший ход, а соперник — худший для вас.','Екі ойыншылы ойында сіз ең жақсы жүрісті, қарсылас сізге ең жаманын таңдайды.'),
 terms:[[L('MAX / MIN','MAX / MIN','MAX / MIN'),L('MAX takes the biggest value, MIN takes the smallest.','MAX берёт наибольшее значение, MIN — наименьшее.','MAX ең үлкен мәнді, MIN ең кішісін алады.')],
  [L('α (alpha)','α (альфа)','α (альфа)'),L('The best value MAX can already guarantee.','Лучшее значение, которое MAX уже гарантирует.','MAX қазірдің өзінде кепілдей алатын ең жақсы мән.')],
  [L('β (beta)','β (бета)','β (бета)'),L('The best value MIN can already guarantee.','Лучшее значение, которое MIN уже гарантирует.','MIN қазірдің өзінде кепілдей алатын ең жақсы мән.')],
  [L('Pruning','Отсечение','Кесу'),L('Skip branches that cannot change the answer (when α ≥ β).','Пропуск ветвей, которые не изменят ответ (когда α ≥ β).','Жауапты өзгертпейтін тармақтарды өткізу (α ≥ β болғанда).')]],
 ex:L('Worked example: MAX → two MIN nodes. Left leaves 3, 5 → MIN = 3, so MAX already has 3. Right branch starts with 2: MIN will choose ≤ 2, which is worse than 3, so the next leaf (9) is cut.','Разбор: MAX → два узла MIN. Слева листья 3 и 5 → MIN = 3, значит MAX уже имеет 3. Справа первый лист 2: MIN выберет ≤ 2, это хуже 3, поэтому следующий лист (9) отсекается.','Талдау: MAX → екі MIN түйіні. Сол жақта 3 және 5 → MIN = 3, яғни MAX-та 3 бар. Оң жақта алғашқы жапырақ 2: MIN ≤ 2 таңдайды, бұл 3-тен жаман, сондықтан келесі жапырақ (9) кесіледі.'),
 rem:[L('Solve a game tree from the leaves up.','Дерево игры решают от листьев вверх.','Ойын ағашын жапырақтан жоғары қарай шешеді.'),L('Alpha-beta gives the same answer as minimax, only faster.','Альфа-бета даёт тот же ответ, что и minimax, только быстрее.','Альфа-бета minimax-пен бірдей жауап береді, тек жылдамырақ.')]},
6:{lead:L('An LLM is a very good "predict the next word" machine trained on a huge amount of text.','LLM — очень сильная машина «предскажи следующее слово», обученная на огромном объёме текста.','LLM — орасан көп мәтінде үйретілген «келесі сөзді болжа» машинасы.'),
 terms:[[L('Token','Токен','Токен'),L('A small piece of text the model reads, like a word or part of a word.','Небольшой фрагмент текста, который читает модель: слово или его часть.','Модель оқитын шағын мәтін бөлігі: сөз не оның бөлшегі.')],
  [L('Attention','Внимание','Назар'),L('Lets each word look at the other words to understand meaning.','Позволяет каждому слову «смотреть» на другие слова, чтобы понять смысл.','Әр сөзге мағынаны түсіну үшін басқа сөздерге «қарауға» мүмкіндік береді.')],
  [L('Context window','Контекстное окно','Контекст терезесі'),L('How much text the model can keep in mind at once.','Сколько текста модель удерживает «в голове» одновременно.','Модель бір мезгілде «есінде» ұстай алатын мәтін көлемі.')],
  [L('Hallucination','Галлюцинация','Галлюцинация'),L('A confident answer that is wrong or invented.','Уверенный, но неверный или выдуманный ответ.','Сенімді айтылған, бірақ қате не ойдан шығарылған жауап.')]],
 ex:L('Example: "The cat sat on the ___". The model gives high probability to "mat" and low probability to "banana". It writes text by repeating this step many times.','Пример: «Кошка сидела на ___». Модель даёт высокую вероятность слову «коврик» и низкую — «банан». Текст она пишет, повторяя этот шаг много раз.','Мысал: «Мысық ___ үстінде отырды». Модель «төсеніш» сөзіне жоғары, «банан» сөзіне төмен ықтималдық береді. Мәтінді осы қадамды қайталап жазады.'),
 rem:[L('LLMs predict likely text, not verified truth.','LLM предсказывают правдоподобный текст, а не проверенную истину.','LLM расталған ақиқатты емес, ықтимал мәтінді болжайды.'),L('Always check important facts.','Важные факты всегда проверяйте.','Маңызды деректі әрдайым тексеріңіз.')]},
7:{lead:L('Generative AI creates new content: text, pictures, sound, video and code.','Генеративный ИИ создаёт новый контент: текст, картинки, звук, видео и код.','Генеративті ЖИ жаңа контент жасайды: мәтін, сурет, дыбыс, бейне және код.'),
 terms:[[L('Diffusion model','Диффузионная модель','Диффузиялық модель'),L('Starts from noise and cleans it step by step into a picture.','Начинает с шума и шаг за шагом очищает его до картинки.','Шудан бастап, оны қадамдап суретке дейін тазартады.')],
  [L('GAN','GAN','GAN'),L('Two networks compete: a forger and a detective.','Две сети соревнуются: фальсификатор и детектив.','Екі желі жарысады: жалған жасаушы және детектив.')],
  [L('Prompt','Промпт','Промпт'),L('Your instruction to the model.','Ваша инструкция модели.','Модельге берген нұсқауыңыз.')],
  [L('Deepfake','Дипфейк','Дипфейк'),L('Realistic fake of a real person\'s face or voice.','Реалистичная подделка лица или голоса реального человека.','Нақты адамның бет-әлпетінің не дауысының шынайы жалғаны.')]],

function theoryHTML(w){
  const x=TH2[w.n];
  return `<div class="th-lead"><span class="th-tag">${T('th_simple')}</span><p>${t(x.lead)}</p></div>
  <h4 class="th-h">${T('th_steps')}</h4><ol class="th-steps">${w.th.map(p=>`<li>${t(p)}</li>`).join('')}</ol>
  <h4 class="th-h">${T('th_terms')}</h4><div class="th-terms">${x.terms.map(([a,b])=>`<div class="th-term"><b>${t(a)}</b><span>${t(b)}</span></div>`).join('')}</div>
  <div class="th-box ex"><b>${T('th_example')}</b><p>${t(x.ex)}</p></div>
  <div class="th-box rem"><b>${T('th_remember')}</b><ul>${x.rem.map(r=>`<li>${t(r)}</li>`).join('')}</ul></div>`;
}

function updateTop(){

function markNav(){
  const r=(location.hash||'#home').slice(1);const base=r.split('-')[0];

/* ===== router ===== */
let ACTIVE=null; // active game controller
const go=h=>{if(location.hash==='#'+h)route();else location.hash=h};
function route(noAnim){
  if(ACTIVE&&ACTIVE.destroy){try{ACTIVE.destroy()}catch(e){}}ACTIVE=null;
  const h=(location.hash||'#home').slice(1)||'home',[base,arg]=h.split('-');
  const m=$('#view');
  let html='';
  try{
    if(base==='games')html=viewGames();
    else if(base==='game')html=viewGame(+arg);
    else if(base==='weeks')html=viewWeeks();
    else if(base==='week')html=viewWeek(+arg);
    else if(base==='test')html=viewTest(+arg);
    else if(base==='theory')html=viewTheory();
    else if(base==='rank')html=viewRank();
    else if(base==='profile')html=viewProfile();
    else html=viewHome();
  }catch(e){console.error(e);html='<div class="card">Error: '+esc(e.message)+'</div>'}
  m.innerHTML=html;
  m.classList.remove('pg-in');if(!noAnim){void m.offsetWidth;m.classList.add('pg-in')}
  scrollTo({top:0});markNav();
  if(base==='home')initHome();
  if(base==='game')mountGame(+arg);
  if(base==='test')mountTest(+arg);
  if(base==='profile')initProfile();
  if(base==='weeks'||base==='week')initWeek(+arg);
  tilt();
}
function setLang(i){
  LANG=i;DB.lang=i;save();document.documentElement.lang=LANGS[i];drawTop();
  const base=(location.hash||'#home').slice(1).split('-')[0];
  if((base==='game'||base==='test')&&ACTIVE&&ACTIVE.render){
    const g=getGame(+(location.hash.split('-')[1]));
    const gt=$('#gt');if(gt&&base==='game')gt.textContent=g.n;
    $$('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
    const tt=$('#gtitle');if(tt&&base==='test')tt.textContent=testTitle(+location.hash.split('-')[1]);
    ACTIVE.render();
  }else route(true);
}
function tilt(){
  $$('.gcard').forEach(c=>{
    c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-4px)`});
    c.addEventListener('mouseleave',()=>{c.style.transform=''});
  });
}

/* leaderboard */
const BOTS=[['Aigerim_K',4120,'🦄'],['Dauren.dev',3560,'🚀'],['NeuralNur',3010,'🧠'],['Aliya_AI',2480,'🤖'],['Timur_Bot',1980,'🐺'],['Madina42',1530,'⚡'],['Arman_X',1180,'🎮'],['Sofia_Py',860,'🦊'],['Ruslan.ml',610,'🛰️'],['Zhanna_K',390,'👽'],['Beibit',220,'👾'],['NewbieOne',90,'🐉']];
function board(period){
  const rows=BOTS.map(b=>({name:b[0],xp:period==='w'?Math.round(b[1]*(0.12+(b[0].length%5)*0.03)):b[1],av:b[2],bot:1}));
  Object.values(DB.users).forEach(u=>rows.push({name:u.name,xp:period==='w'?u.weekly.xp:u.xp,av:u.av,me:u.name===DB.cur}));
  return rows.sort((a,b)=>b.xp-a.xp);
}
function boardHTML(period,limit,compact){
  const rows=board(period);const shown=limit?rows.slice(0,limit):rows;
  const mine=rows.findIndex(r=>r.me);
  if(limit&&mine>=limit)shown.push(rows[mine]);
  return `<div class="scroll-x"><table><thead><tr><th>#</th><th>${T('player')}</th>${compact?'':`<th>${T('level')}</th>`}<th>XP</th>${compact?'':'<th></th>'}</tr></thead><tbody>${shown.map(r=>{const i=rows.indexOf(r);return `<tr class="${r.me?'me-row':''}"><td class="rank-n">${i+1}</td><td>${r.av} ${esc(r.name)}</td>${compact?'':`<td>${t(LVN[lvOf(period==='w'?r.xp*3:r.xp)])}</td>`}<td class="num">${r.xp}</td>${compact?'':`<td>${r.bot?`<button class="btn sm sec" data-duel="${esc(r.name)}" data-bxp="${r.xp}">${T('duel')}</button>`:''}</td>`}</tr>`}).join('')}</tbody></table></div>`;
}

function QuizRun(root,o){
  const st={i:0,score:0,correct:0,combo:0,maxCombo:0,left:o.time||20,ans:null,order:[],hid:[],rs:0,rlast:null,t0:Date.now(),done:false,hinted:false};
  let TIME=o.time||20;let timer=null,keyh=null;
  function setup(){const q=o.qs[st.i];TIME=o.timeFor?o.timeFor(st.i):(o.time||20);st.order=shuffle(q.o.map((_,i)=>i));st.ans=null;st.hid=[];st.left=TIME;st.rlast=null;st.hinted=false;startTimer()}
  function startTimer(){stopTimer();timer=setInterval(()=>{
    if(st.ans!==null||st.done)return;
    st.left=Math.max(0,st.left-.25);const f=$('#tfill',root);if(f)f.style.transform=`scaleX(${st.left/TIME})`;
    const tl=$('#tleft',root);if(tl)tl.textContent=Math.ceil(st.left);
    if(st.left<=0)answer(-1);
  },250)}
  function stopTimer(){if(timer){clearInterval(timer);timer=null}}
  function answer(k){
    if(st.ans!==null||st.done)return;
    const q=o.qs[st.i];const orig=k>=0?st.order[k]:-1;const ok=orig===q.a;
    st.ans=k;
    if(ok){st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);st.correct++;st.score+=100+Math.round(st.left/TIME*50)+(st.combo>1?st.combo*10:0);sfx('ok')}
    else{st.combo=0;sfx('bad')}
    if(o.duel){const hit=Math.random()<o.duel.acc;st.rlast=hit;if(hit)st.rs+=100+rint(5,45)}
    stopTimer();
    if(o.onAnswer)o.onAnswer(ok,q,st);
    render();
  }
  function next(){
    if(st.done)return;
    st.i++;
    if(st.i>=o.qs.length||(o.stopWhen&&o.stopWhen(st)))return finish();
    setup();render();
  }
  function finish(){
    st.done=true;stopTimer();
    if(o.onEnd)o.onEnd({correct:st.correct,total:o.qs.length,answered:st.i+(st.ans!==null?1:0),score:st.score,maxCombo:st.maxCombo,rs:st.rs,time:Math.round((Date.now()-st.t0)/1000)});
  }
  function render(){
    if(st.done)return;
    const q=o.qs[st.i];if(!q)return;
    const ans=st.ans,okIdx=st.order.indexOf(q.a);
    const hud=`<div class="hud"><span class="chip">${TF('q_of',{a:st.i+1,b:o.qs.length})}</span><span class="chip">${T('score')}: <b>${st.score}</b></span>${st.combo>1?`<span class="chip combo">${T('combo')} ×${st.combo}</span>`:''}${o.duel?`<span class="chip warn">${esc(o.duel.name)}: <b>${st.rs}</b></span>`:''}<span class="chip">⏱ <b id="tleft">${Math.ceil(st.left)}</b></span></div>`;
    root.innerHTML=`${o.top?o.top(st):''}${hud}<div class="timer"><i id="tfill" style="transform:scaleX(${st.left/TIME})"></i></div>
    <div class="panel"><h3 style="font-size:1.2rem;font-family:var(--body);font-weight:700">${esc(t(q.q))}</h3>
    <div class="opts">${st.order.map((oi,k)=>{const txt=t(q.o[oi]);let c='opt';if(ans!==null){if(oi===q.a)c+=' ok';else if(k===ans)c+=' bad';else c+=' off'}else if(st.hid.includes(k))c+=' off';
      return `<button class="${c}" data-k="${k}" ${ans!==null||st.hid.includes(k)?'disabled':''}><b style="color:var(--a1);margin-right:8px">${'ABCD'[k]}</b>${esc(txt)}</button>`}).join('')}</div>
    ${ans===null?`<button class="btn sec sm" id="qh" ${st.hinted?'disabled':''}>💡 ${T('hint')} · ${T('fifty')}</button>`:
      `<div class="expl"><b>${ans>=0&&st.order[ans]===q.a?'✔ '+T('correct'):(ans<0?'⏱ '+T('time_up'):'✖ '+T('wrong'))}</b><br>${esc(t(q.e))}${o.duel&&st.rlast!==null?`<br><span class="muted">${esc(o.duel.name)}: ${st.rlast?'✔':'✖'}</span>`:''}</div>
      <div style="margin-top:12px"><button class="btn" id="qn">${st.i+1>=o.qs.length?T('finish'):T('next_q')} →</button></div>`}</div>`;
    $$('.opt',root).forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    const h=$('#qh',root);if(h)h.onclick=()=>{
      if(!useHint())return;hintCount();st.hinted=true;
      const wrong=st.order.map((oi,k)=>k).filter(k=>st.order[k]!==q.a);
      st.hid=shuffle(wrong).slice(0,Math.max(0,wrong.length-1>=2?2:1));render();
    };
    const n=$('#qn',root);if(n)n.onclick=next;
  }
  keyh=e=>{
    if(!document.body.contains(root))return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    const k='1234'.indexOf(e.key);if(k>=0&&st.ans===null)answer(k);
    else if((e.key==='Enter')&&st.ans!==null){const n=$('#qn',root);if(n)n.click()}
  };
  document.addEventListener('keydown',keyh);
  setup();
  return{render,st,destroy(){stopTimer();document.removeEventListener('keydown',keyh);st.done=true},stop(){stopTimer();st.done=true}};
}

    <div class="tl" id="tl">${S.order.map((v,pos)=>{const e=S.items[v];let c='ev';if(S.sel===pos)c+=' sel';if(S.checked)c+=v===pos?' ok':' bad';
      const showY=S.checked;
      return `<div class="${c}" draggable="${!S.checked}" data-p="${pos}"><span class="grip">⋮⋮</span>${showY?`<span class="yr">${e.y}</span>`:''}<span style="flex:1"><b>${esc(t(e.n))}</b>${S.checked?`<span class="muted" style="display:block;font-size:.85rem">${esc(t(e.f))}</span>`:''}</span>${S.checked?'':`<span class="row" style="gap:4px"><button class="btn sec sm" data-mv="${pos},-1" aria-label="up">▲</button><button class="btn sec sm" data-mv="${pos},1" aria-label="down">▼</button></span>`}</div>`}).join('')}</div>
    <div class="row">${S.checked?`<button class="btn" id="fin">${T('finish')}</button><button class="btn sec" id="again">${T('replay')}</button>`:`<button class="btn" id="chk">${T('check')}</button><button class="btn sec" id="hn">💡 ${T('hint')}</button>`}</div>`;
    $$('.ev',root).forEach(el=>{
      const pos=+el.dataset.p;
      el.addEventListener('click',e=>{if(S.checked||e.target.closest('[data-mv]'))return;if(S.sel===null)S.sel=pos;else{if(S.sel!==pos)swap(S.sel,pos);S.sel=null}render()});
      el.addEventListener('dragstart',e=>{S.drag=pos;el.classList.add('drag');try{e.dataTransfer.setData('text/plain',String(pos));e.dataTransfer.effectAllowed='move'}catch(_){}});
      el.addEventListener('dragend',()=>el.classList.remove('drag'));
      el.addEventListener('dragover',e=>e.preventDefault());
      el.addEventListener('drop',e=>{e.preventDefault();if(S.drag===null||S.drag===pos)return;const a=S.order.splice(S.drag,1)[0];S.order.splice(pos,0,a);S.drag=null;S.sel=null;render()});
    });
    $$('[data-mv]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();const[p,d]=b.dataset.mv.split(',').map(Number);if(p+d>=0&&p+d<n){swap(p,p+d);S.sel=null;render()}});
    const c=$('#chk',root);if(c)c.onclick=check;
    const h=$('#hn',root);if(h)h.onclick=()=>{const hid=S.items.map((_,i)=>i).filter(i=>!S.hinted[i]);if(!hid.length)return;if(!useHint())return;hintCount();const v=pick(hid);S.hinted[v]=1;const at=S.order.indexOf(v);if(at!==v){swap(at,v)}S.sel=null;render()};
    const f=$('#fin',root);if(f)f.onclick=()=>showResult(2,{score:S.res,max:n,correct:S.res,total:n,bonusXP:S.diff==='hard'?15:S.diff==='medium'?5:0},intro);
    const a=$('#again',root);if(a)a.onclick=intro;
  }
  const LABEL_OLD=()=>t(L('older','раньше','ертерек')),LABEL_NEW=()=>t(L('newer','позже','кейінірек'));
  return{render,destroy(){}};
};

function genTree(depth,branch){
  let id=0;const all=[];
  function mk(d,type,par){
    const n={id:id++,d,par,type:d===depth?'leaf':type,kids:[],idx:0};all.push(n);
    if(n.type==='leaf')n.val=rint(1,9);
    else for(let i=0;i<branch[d];i++){const k=mk(d+1,type==='max'?'min':'max',n);k.idx=i;n.kids.push(k)}
    return n;
  }
  const root=mk(0,'max',null);
  const leaves=all.filter(n=>n.type==='leaf');
  const W=Math.max(300,leaves.length*50+30),H=depth===2?250:depth===3?330:400;
  leaves.forEach((l,i)=>{l.x=30+i*((W-60)/Math.max(1,leaves.length-1))});
  (function lay(n){if(n.type!=='leaf'){n.kids.forEach(lay);n.x=(n.kids[0].x+n.kids[n.kids.length-1].x)/2}n.y=34+n.d*((H-70)/depth)})(root);
  return{root,all,W,H};
}
function mmVal(n){if(n.type==='leaf')return n.val;const v=n.kids.map(mmVal);return n.type==='max'?Math.max(...v):Math.min(...v)}
function postOrder(n,out){out=out||[];n.kids.forEach(k=>postOrder(k,out));if(n.type!=='leaf')out.push(n);return out}
const INF=x=>x===Infinity?'+∞':x===-Infinity?'−∞':String(x);
function treeSVG(tr,o){
  let e='',nd='';
  tr.all.forEach(n=>n.kids.forEach(k=>{e+=`<line class="te ${o.edge?o.edge(n,k):''}" x1="${n.x}" y1="${n.y}" x2="${k.x}" y2="${k.y}"/>`}));
  tr.all.forEach(n=>{
    const cls=(o.cls?o.cls(n):'')||'',txt=o.label?o.label(n):'';
    let shape;
    if(n.type==='leaf')shape=`<rect x="${n.x-16}" y="${n.y-14}" width="32" height="28" rx="7"/>`;
    else if(n.type==='max')shape=`<polygon points="${n.x},${n.y-21} ${n.x-21},${n.y+15} ${n.x+21},${n.y+15}"/>`;
    else shape=`<polygon points="${n.x-21},${n.y-15} ${n.x+21},${n.y-15} ${n.x},${n.y+21}"/>`;
    const ty=n.type==='max'?n.y+3:n.type==='min'?n.y-3:n.y;
    nd+=`<g class="tn ${n.type} ${cls}" data-id="${n.id}" tabindex="0" role="button" aria-label="${n.type} ${txt}">${shape}<text x="${n.x}" y="${ty}">${txt}</text>${o.sub&&o.sub(n)?`<text class="lab" x="${n.x}" y="${n.y+(n.type==='leaf'?28:n.type==='min'?34:30)}">${o.sub(n)}</text>`:''}</g>`;
  });
  const legend=`<g font-size="11" fill="#9aa4d6" font-family="Exo 2"><polygon points="14,8 4,26 24,26" fill="none" stroke="var(--a1)" stroke-width="2"/><text x="30" y="22">MAX</text><polygon points="70,8 90,8 80,26" fill="none" stroke="var(--a2)" stroke-width="2"/><text x="96" y="22">MIN</text></g>`;
  return `<svg class="tree-svg" viewBox="0 0 ${tr.W} ${tr.H}" role="img">${e}${nd}${legend}</svg>`;
}
const typeName=n=>n.type==='max'?'MAX':'MIN';

GAMES[2].mod=function(root,g){
  const CFG={easy:{depth:2,branch:[3,2]},medium:{depth:3,branch:[2,2,2]},hard:{depth:3,branch:[2,3,2]}};
  let S={diff:null,round:0,rounds:7,tree:null,order:[],idx:0,tries:0,pts:0,tot:0,mist:0,msg:null,flash:null,picked:{}, done:false};
  function intro(){
    S.diff=null;
    root.innerHTML=introHTML(g,`<div style="margin-top:16px"><button class="btn" id="mgo">${T('begin')}</button></div>`);
    $('#mgo',root).onclick=()=>{S.round=0;S.pts=0;S.tot=0;S.mist=0;newTree()};
  }
  function newTree(){
    S.diff=S.round<2?'easy':S.round<5?'medium':'hard';const c=CFG[S.diff];S.tree=genTree(c.depth,c.branch);S.order=postOrder(S.tree.root);S.idx=0;S.tries=0;S.msg=null;S.picked={};S.done=false;S.tot+=S.order.length;S.round++;
    S.tree.all.forEach(n=>{n.known=n.type==='leaf'});render();
  }
  const cur=()=>S.order[S.idx];
  function choose(id){
    const n=cur();if(!n||S.done)return;
    const k=n.kids.find(x=>x.id===id);if(!k)return;
    const vals=n.kids.map(x=>x.val),best=n.type==='max'?Math.max(...vals):Math.min(...vals);
    if(k.val===best){
      n.val=best;n.known=true;S.picked[n.id]=k.id;if(S.tries===0)S.pts++;
      S.msg={ok:true,txt:`${typeName(n)}: ${n.type==='max'?'max':'min'}(${vals.join(', ')}) = ${best}`};S.tries=0;S.idx++;sfx('ok');
      if(S.idx>=S.order.length){S.done=true;const r=S.tree.root;const bi=r.kids.findIndex(x=>x.id===S.picked[r.id])+1;S.msg={ok:true,txt:TF('best_move',{n:bi,v:r.val})};sfx('win')}
    }else{
      S.mist++;showLose(root,()=>{S.round=0;S.pts=0;S.tot=0;S.mist=0;newTree()});return;
    }
    render();
  }
  function hint(){const n=cur();if(!n||S.done)return;if(!useHint())return;hintCount();
    const vals=n.kids.map(x=>x.val),best=n.type==='max'?Math.max(...vals):Math.min(...vals);S.tries=Math.max(S.tries,1);
    S.flash=n.kids.find(x=>x.val===best).id;render();setTimeout(()=>{S.flash=null;render()},1400)}
  function render(){
    if(!S.diff)return intro();
    const tr=S.tree,c=cur();
    const svg=treeSVG(tr,{
      cls:n=>(c&&n.id===c.id?'cur ':'')+(n.known&&n.type!=='leaf'?'done ':'')+(c&&c.kids.some(k=>k.id===n.id)&&n.id===S.flash?'cur ':''),
      label:n=>n.known?n.val:'?',
      edge:(p,k)=>S.picked[p.id]===k.id?'pick':''
    });
    root.innerHTML=`<div class="hud"><span class="chip">${TF('stage_n',{a:S.round,b:S.rounds})}</span><span class="chip">${T('score')}: <b>${S.pts}</b>/${S.tot}</span><span class="chip bad">${T('mistakes')}: <b>${S.mist}</b></span><span class="chip">${T(S.diff)}</span></div>
    <div class="panel">${svg}

function alphaBeta(tree){
  const rec=[],visited=new Set();let cutRoots=[];
  function ab(n,a,b){
    visited.add(n.id);
    if(n.type==='leaf'){rec.push({k:'leaf',id:n.id,v:n.val,a,b});return n.val}
    rec.push({k:'visit',id:n.id,a,b,t:n.type});
    let v=n.type==='max'?-Infinity:Infinity;
    for(let i=0;i<n.kids.length;i++){
      const c=ab(n.kids[i],a,b);
      if(n.type==='max'){v=Math.max(v,c);a=Math.max(a,v)}else{v=Math.min(v,c);b=Math.min(b,v)}
      rec.push({k:'upd',id:n.id,v,a,b,t:n.type});
      if(a>=b&&i<n.kids.length-1){const rest=n.kids.slice(i+1);rest.forEach(r=>cutRoots.push(r.id));rec.push({k:'cut',id:n.id,a,b,t:n.type,cut:rest.map(r=>r.id)});break}
    }
    return v;
  }
  const val=ab(tree.root,-Infinity,Infinity);
  return{rec,visited,cutRoots,val};
}
function subtreeIds(n,out){out=out||[];out.push(n.id);n.kids.forEach(k=>subtreeIds(k,out));return out}

      for(const[x,y]of nb(cur.c,cur.r)){const nk=key(x,y);if(closed.has(nk))continue;const ng=cur.g+cellCost(g,x,y);
        if(!gc.has(nk)||ng<gc.get(nk)){gc.set(nk,ng);par.set(nk,k);open.push({c:x,r:y,g:ng,f:pri(x,y,ng)})}}

  }

GAMES[6].mod=function(root,g){
  const DS={
    pets:{n:L('Cats vs Dogs','Кошки и собаки','Мысықтар мен иттер'),c:[L('cat','кошка','мысық'),L('dog','собака','ит')],ax:[L('ear pointiness','острота ушей','құлақ үшкірлігі'),L('snout length','длина морды','тұмсық ұзындығы')],
      gen:r=>{const o=[];for(let i=0;i<60;i++){o.push([[.72+gn(r)*.14,.3+gn(r)*.14],0]);o.push([[.4+gn(r)*.16,.62+gn(r)*.15],1])}return o}},
    spam:{n:L('Spam detector','Определение спама','Спам анықтау'),c:[L('normal','обычное','қалыпты'),L('spam','спам','спам')],ax:[L('links in email','ссылок в письме','хаттағы сілтеме'),L('CAPS ratio','доля ЗАГЛАВНЫХ','БАС әріп үлесі')],
      gen:r=>{const o=[];for(let i=0;i<60;i++){o.push([[.25+gn(r)*.13,.22+gn(r)*.13],0]);o.push([[.68+gn(r)*.15,.66+gn(r)*.15],1])}return o}},
    exam:{n:L('Predict exam result','Прогноз экзамена','Емтихан нәтижесін болжау'),c:[L('fail','не сдал','құлады'),L('pass','сдал','тапсырды')],ax:[L('study hours','часы учёбы','оқу сағаты'),L('sleep hours','часы сна','ұйқы сағаты')],
      gen:r=>{const o=[];for(let i=0;i<120;i++){const a=r(),b=r(),s=a*1.1+b*.6+gn(r)*.12;o.push([[a,b],s>.82?1:0])}return o}},
    digits:{n:L('Digits 0 / 1','Цифры 0 / 1','0 / 1 сандары'),c:['0','1'],grid:true,gen:r=>{
      const P0=['01110','10001','10001','10001','01110'],P1=['00100','01100','00100','00100','01110'];
      const mk=(p,y)=>[p.join('').split('').map(Number).map(v=>r()<.1?1-v:v),y];const o=[];for(let i=0;i<60;i++){o.push(mk(P0,0));o.push(mk(P1,1))}return o}}
  };
  function gn(r){let s=0;for(let i=0;i<4;i++)s+=r();return(s-2)*1.7}
  let S={ds:'pets',model:'knn',k:3,split:70,lr:.5,epochs:120,data:null,train:[],test:[],w:null,b:0,ep:0,hist:[],trained:false,tm:null,best:{},seed:1,draw:Array(25).fill(0),trA:0,teA:0,started:false};
  function stop(){if(S.tm){clearInterval(S.tm);S.tm=null}}
  function newData(){
    stop();S.seed=Math.floor(Math.random()*1e6);const r=rng(S.seed);
    S.data=shuffle(DS[S.ds].gen(r),r);cut();S.trained=false;S.hist=[];S.ep=0;
  }
  function cut(){const n=Math.round(S.data.length*S.split/100);S.train=S.data.slice(0,n);S.test=S.data.slice(n)}
  const feat=x=>DS[S.ds].grid?x:x.map(v=>(v-.5)*2);
  const sig=z=>1/(1+Math.exp(-z));
  function predictP(x){
    if(S.model==='knn'){
      const f=feat(x);const d=S.train.map(([xx,y])=>{const g=feat(xx);let s=0;for(let i=0;i<f.length;i++)s+=(f[i]-g[i])**2;return[s,y]}).sort((a,b)=>a[0]-b[0]).slice(0,S.k);
      return d.reduce((s,a)=>s+a[1],0)/d.length;
    }
    if(!S.w)return .5;const f=feat(x);let z=S.b;f.forEach((v,i)=>z+=S.w[i]*v);return sig(z);
  }
  const accOf=set=>set.length?set.filter(([x,y])=>(predictP(x)>=.5?1:0)===y).length/set.length:0;
  function trainLogit(){
    stop();const d=feat(S.train[0][0]).length;S.w=Array(d).fill(0);S.b=0;S.ep=0;S.hist=[];S.trained=true;
    const m=S.train.length;
    S.tm=setInterval(()=>{
      for(let s=0;s<4&&S.ep<S.epochs;s++){
        const gw=Array(d).fill(0);let gb=0,loss=0;
        S.train.forEach(([x,y])=>{const f=feat(x);let z=S.b;f.forEach((v,i)=>z+=S.w[i]*v);const p=sig(z),e=p-y;loss+=-(y*Math.log(p+1e-9)+(1-y)*Math.log(1-p+1e-9));f.forEach((v,i)=>gw[i]+=e*v);gb+=e});
        S.w=S.w.map((w,i)=>w-S.lr*gw[i]/m);S.b-=S.lr*gb/m;S.ep++;S.loss=loss/m;if(S.ep%3===0)S.hist.push([S.ep,S.loss]);
      }
      update();if(S.ep>=S.epochs){stop();finishTrain()}
    },50);
  }
  function trainKnn(){S.trained=true;finishTrain();update()}
  function finishTrain(){
    S.trA=accOf(S.train);S.teA=accOf(S.test);S.best[S.ds]=Math.max(S.best[S.ds]||0,S.teA);sfx(S.teA>=.85?'win':'ok');
    if(S.teA>=.85)toast('✔ '+T('t_good'));render();
  }
  function update(){
    const stt=$('#tst',root);if(stt&&S.model==='logit'&&S.trained){S.trA=accOf(S.train);S.teA=accOf(S.test);stt.innerHTML=statHTML()}
    drawMain();drawLossT();
  }
  const statHTML=()=>`<span class="chip">${S.model==='logit'?T('n_epoch')+': <b>'+S.ep+'</b>':'k = <b>'+S.k+'</b>'}</span><span class="chip">${T('t_trainacc')}: <b>${S.trained?Math.round(S.trA*100)+'%':'—'}</b></span><span class="chip ${S.trained&&S.teA>=.85?'ok':''}">${T('t_testacc')}: <b>${S.trained?Math.round(S.teA*100)+'%':'—'}</b></span>`;
  function drawMain(){
    const cv=$('#tcv',root);if(!cv||DS[S.ds].grid)return;const x=cv.getContext('2d'),W=cv.width;x.clearRect(0,0,W,W);
    if(S.trained){const N=32,s=W/N;for(let i=0;i<N;i++)for(let j=0;j<N;j++){const p=predictP([(i+.5)/N,1-(j+.5)/N]);x.fillStyle=p>=.5?`rgba(55,230,160,${.1+Math.abs(p-.5)*.5})`:`rgba(255,210,61,${.1+Math.abs(p-.5)*.5})`;x.fillRect(i*s,j*s,s+1,s+1)}}
    const dot=(set,ring)=>set.forEach(([f,y])=>{x.beginPath();x.arc(f[0]*W,(1-f[1])*W,ring?5:4,0,7);x.fillStyle=y?'#37e6a0':'#ffd23d';x.fill();x.lineWidth=ring?2.5:1;x.strokeStyle=ring?'#fff':'rgba(0,0,0,.6)';x.stroke()});
    dot(S.train,false);dot(S.test,true);
  }
  function drawLossT(){
    const cv=$('#tlc',root);if(!cv)return;const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);if(S.hist.length<2)return;
    const mx=Math.max(...S.hist.map(h=>h[1]),.7),xs=S.hist[S.hist.length-1][0];x.strokeStyle='#ffd23d';x.lineWidth=2.5;x.beginPath();
    S.hist.forEach(([e,l],i)=>{const px=e/xs*(cv.width-6)+3,py=cv.height-4-l/mx*(cv.height-10);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
  }
  function pixPred(){const p=S.trained?predictP(S.draw):null;return p}
  function render(){
    if(!S.started){
      root.innerHTML=introHTML(g,`<div style="margin-top:16px"><button class="btn" id="tb">${T('begin')}</button></div>`);
      $('#tb',root).onclick=()=>{S.started=true;newData();render()};return;
    }
    const d=DS[S.ds],grid=d.grid;
    const msg=S.trained?(S.teA>=.85?T('t_good'):(S.trA-S.teA>.1?T('t_over'):(S.teA<.7?T('t_under'):''))):T('t_untrained');
    root.innerHTML=`<div class="hud" id="tst">${statHTML()}</div>
    <div class="grid g2"><div class="panel"><h4>${T('t_data')}</h4><div class="diff">${Object.keys(DS).map(k=>`<button data-ds="${k}" class="${S.ds===k?'on':''}">${t(DS[k].n)}${S.best[k]>=.85?' ✔':''}</button>`).join('')}</div>
     <div class="muted" style="margin:10px 0">${!grid?`<span style="color:#ffd23d">●</span> ${t(d.c[0])} &nbsp; <span style="color:#37e6a0">●</span> ${t(d.c[1])} &nbsp; ○ = test`:''}</div>
     ${grid?`<div class="muted">${T('t_draw')}</div><div id="pad" style="display:grid;grid-template-columns:repeat(5,44px);gap:4px;margin:10px 0">${S.draw.map((v,i)=>`<button data-px="${i}" style="width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:${v?'var(--a1)':'rgba(255,255,255,.06)'}" aria-label="pixel ${i}"></button>`).join('')}</div>
       <div class="row"><button class="btn sm sec" id="tclr">${T('t_clear')}</button><span class="chip warn">${T('t_pred')}: <b>${S.trained?(pixPred()>=.5?'1':'0')+' ('+Math.round(Math.max(pixPred(),1-pixPred())*100)+'%)':'—'}</b></span></div>`
       :`<canvas class="cv" id="tcv" width="360" height="360" style="max-width:360px"></canvas><div class="muted" style="font-size:.8rem;display:flex;justify-content:space-between;max-width:360px"><span>x: ${t(d.ax[0])}</span><span>y: ${t(d.ax[1])}</span></div>`}</div>
     <div class="panel"><h4>${T('t_model')}</h4><div class="diff"><button data-m="knn" class="${S.model==='knn'?'on':''}">k-NN</button><button data-m="logit" class="${S.model==='logit'?'on':''}">Logistic</button></div>
      ${S.model==='knn'?`<label for="tk">${T('t_k')}: <b id="tkv">${S.k}</b></label><input type="range" id="tk" min="1" max="15" step="2" value="${S.k}">`:`<label for="tlr">${T('n_lr')}: <b id="tlrv">${S.lr}</b></label><input type="range" id="tlr" min="0.05" max="2" step="0.05" value="${S.lr}"><label for="tep">${T('t_epochs')}: <b id="tepv">${S.epochs}</b></label><input type="range" id="tep" min="20" max="400" step="20" value="${S.epochs}">`}

    <div class="row" style="margin-top:14px"><button class="btn pink" id="tfin">${T('finish')}</button></div>`;
    $$('[data-ds]',root).forEach(b=>b.onclick=()=>{S.ds=b.dataset.ds;if(S.model==='knn'||true){}newData();render()});
    $$('[data-m]',root).forEach(b=>b.onclick=()=>{S.model=b.dataset.m;stop();S.trained=false;render()});

      showResult(7,{score:Math.round(pct*100),max:100,correct:Math.round(bst*100),total:100,bonusXP:Math.max(0,solved-1)*10},()=>{S.started=false;S.best={};render()},T('t_testacc')+': '+Math.round(bst*100)+'%')};
    drawMain();drawLossT();
  }
  return{render,destroy(){stop()}};
};

};
function scorePrompt(txt,task){
  const w=txt.trim().split(/\s+/).filter(Boolean),n=w.length;
  const num=/\d/.test(txt);
  const clarity=clamp((PCRIT.verbs.test(txt)?45:10)+Math.min(40,n*2.2)-(n>140?20:0),0,100);
  const context=clamp((PCRIT.context.test(txt)?55:8)+(n>12?25:0)+(task.kw.test(txt)?20:0),0,100);
  const specific=clamp((task.kw.test(txt)?35:5)+(num?25:0)+Math.min(40,n*1.4),0,100);
  const constraints=clamp((PCRIT.constraints.test(txt)?65:5)+(num?25:0)+(n>25?10:0),0,100);
  const format=clamp((PCRIT.format.test(txt)?75:5)+(n>20?15:0)+(/:/.test(txt)?10:0),0,100);
  const s={clarity,context,specific,constraints,format};
  const total=Math.round((clarity+context+specific+constraints+format)/5);
  return{s:Object.fromEntries(Object.entries(s).map(([k,v])=>[k,Math.round(v)])),total,n};
}
